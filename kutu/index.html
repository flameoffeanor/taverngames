<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kutu Oyunları Koleksiyonu | Tavern Games</title>
<meta name="description" content="Tavern Games kutu oyunu koleksiyonu: 100'den fazla oyun, BGG puanlarıyla. Kadıköy'deki kutu oyunu gecelerinde oynayabileceğin oyunlar."><link rel="canonical" href="https://taverngames.com.tr/kutu/"><meta property="og:title" content="Kutu Oyunları Koleksiyonu | Tavern Games"><meta property="og:description" content="Tavern Games kutu oyunu koleksiyonu: 100'den fazla oyun, BGG puanlarıyla. Kadıköy'deki kutu oyunu gecelerinde oynayabileceğin oyunlar."><meta property="og:url" content="https://taverngames.com.tr/kutu/"><meta property="og:image" content="https://taverngames.com.tr/assets/og.jpg"><meta property="og:type" content="website"><meta property="og:locale" content="tr_TR">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/meeple_mavi_beyaz.webp"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/kutu/oyunlar.css"><script src="/nav.js" defer></script></head>
<body data-theme="kutu">
<main class="wrap wide">
<section class="gh"><h1 class="cz">Kutu Oyunları</h1><p><b id="cnt">0</b> oyunluk koleksiyon. </p></section>
<div class="bar"><input id="q" type="search" placeholder="Oyun ara…" autocomplete="off"><select id="s"><option value="az">A-Z</option><option value="r">BGG puanı</option></select></div>
<div id="grid" class="gg"></div>
<p id="none" class="none" hidden>Aramana uyan oyun yok.</p>
</main>
<footer><img src="/assets/logo_beyaz_kenar_yazisiz.webp" alt=""><div>© Tavern Games Club · Puanlar BoardGameGeek'ten</div></footer>
<script>
/* Veri Google Sheet'ten gelir: A=Oyun adı, B=BGG puanı, C=Görsel linki, D=BGG linki (isteğe bağlı). Satır eklemek/silmek yeterli. */
const SHEET_ID='1eeInnp4_jk19FtBo7oozfdvBzg_jNhiUkEBp8gOP_Tw',KEY='tg_kutu_cache';
const $=id=>document.getElementById(id);let all=[];
const norm=s=>(s||'').toLocaleLowerCase('tr').replace(/[^a-z0-9ğüşıöç]+/g,'');
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ph(n){return el('div','ph',n.split(/[\s:]+/).filter(w=>/^[A-Za-zÀ-ÿ0-9]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join(''))}
function card(g){const a=el(g.u?'a':'div','gc');if(g.u){a.href=g.u;a.target='_blank';a.rel='noopener'}
 const im=el('div','gi');if(g.img){const i=document.createElement('img');i.alt=g.n;i.loading='lazy';i.referrerPolicy='no-referrer';i.onerror=()=>{im.replaceChildren(ph(g.n))};i.src=g.img;im.append(i)}else im.append(ph(g.n));
 a.append(im,el('div','gn',g.n));if(g.r)a.append(el('div','gr','★ '+g.r.toFixed(1)));return a}
function draw(){const q=norm($('q').value),so=$('s').value;const v=all.filter(g=>!q||norm(g.n).includes(q));
 v.sort(so=='r'?(a,b)=>(b.r||0)-(a.r||0)||a.n.localeCompare(b.n,'tr'):(a,b)=>a.n.replace(/^the /i,'').localeCompare(b.n.replace(/^the /i,''),'tr'));
 $('grid').replaceChildren(...v.map(card));$('none').hidden=!!v.length||!all.length;$('cnt').textContent=all.length}
$('q').oninput=draw;$('s').onchange=draw;
function parse(rows){const seen=new Set(),list=[];
 rows.forEach(c=>{const n=(c[0]||'').trim();if(!n||/^(oyun|oyunlar)$/i.test(n)||seen.has(norm(n)))return;seen.add(norm(n));
  const p=parseFloat(String(c[1]).replace(',','.')),im=(c[2]||'').trim(),u=(c[3]||'').trim();
  list.push({n,r:isNaN(p)?0:p,img:/^https?:\/\//.test(im)?im:'',u:/^https?:\/\//.test(u)?u:''})});return list}
function cached(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
fetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=0').then(r=>r.text()).then(x=>{
 const o=JSON.parse(x.slice(x.indexOf('{'),x.lastIndexOf('}')+1)),rows=o.table.rows.map(r=>(r.c||[]).map(z=>z?(z.v!=null?String(z.v):''):''));
 try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}all=parse(rows);draw()}).catch(()=>{const c=cached();if(c){all=parse(c);draw()}else{$('none').textContent='Liste şu an yüklenemedi.';$('none').hidden=false}});
</script></body></html>
