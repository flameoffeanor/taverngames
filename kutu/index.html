<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kutu Oyunları · Tavern Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/meeple_mavi_beyaz.webp"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/kutu/oyunlar.css"><script src="/nav.js" defer></script></head>
<body data-theme="kutu">
<main class="wrap wide">
<section class="gh"><h1 class="cz">Kutu Oyunları</h1><p><b id="cnt">0</b> oyunluk koleksiyon. Kutulara basınca BoardGameGeek sayfası açılır.</p></section>
<div class="bar"><input id="q" type="search" placeholder="Oyun ara…" autocomplete="off"><select id="s"><option value="az">A-Z</option><option value="r">BGG puanı</option></select></div>
<div id="grid" class="gg"></div>
<p id="none" class="none" hidden>Aramana uyan oyun yok.</p>
</main>
<footer><img src="/assets/logo_beyaz_kenar_yazisiz.webp" alt=""><div>© Tavern Games Club · Puanlar BoardGameGeek'ten</div></footer>
<script>
/* Sheet'te "Ekstra" sekmesi: A=Oyun adı, B=BGG puanı, C=Görsel (tam link ya da kutu/img klasöründeki dosya adı), D=BGG linki, E=Gizle (x yazarsan o oyun listeden kalkar) */
const SHEET_ID='1UCMAlpti9YEssy5HXvaITVCxLESZDFmHYzrA1PK7ANY',TAB='Ekstra';
const $=id=>document.getElementById(id);let all=[];
const norm=s=>(s||'').toLocaleLowerCase('tr').replace(/[^a-z0-9ğüşıöç]+/g,'');
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function card(g){const a=el(g.u?'a':'div','gc');if(g.u){a.href=g.u;a.target='_blank';a.rel='noopener'}
 const im=el('div','gi');if(g.img){const i=document.createElement('img');i.src=g.img;i.alt=g.n;i.loading='lazy';i.onerror=()=>{i.remove();im.append(ph(g.n))};im.append(i)}else im.append(ph(g.n));
 a.append(im,el('div','gn',g.n));if(g.r)a.append(el('div','gr','★ '+g.r.toFixed(1)));return a}
function ph(n){const d=el('div','ph',n.split(/[\s:]+/).filter(w=>/^[A-Za-zÀ-ÿ0-9]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join(''));return d}
function draw(){const q=norm($('q').value),so=$('s').value;const v=all.filter(g=>!q||norm(g.n).includes(q));
 v.sort(so=='r'?(a,b)=>(b.r||0)-(a.r||0)||a.n.localeCompare(b.n,'tr'):(a,b)=>a.n.replace(/^the /i,'').localeCompare(b.n.replace(/^the /i,''),'tr'));
 const gr=$('grid');gr.replaceChildren(...v.map(card));$('none').hidden=!!v.length}
$('q').oninput=draw;$('s').onchange=draw;
const U=(t)=>'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+t;
fetch('/kutu/games.json').then(r=>r.json()).then(j=>{all=j.map(g=>({n:g.n,r:g.r,img:'/kutu/img/'+g.id+'.webp',u:'https://boardgamegeek.com/boardgame/'+g.id}));$('cnt').textContent=all.length;draw();
 return fetch(U(TAB)).then(r=>r.text()).then(x=>{const o=JSON.parse(x.slice(x.indexOf('{'),x.lastIndexOf('}')+1));const have=new Set(all.map(g=>norm(g.n)));
  const hide=new Set(),add=[];
  o.table.rows.forEach(r=>{const c=(r.c||[]).map(z=>z?(z.v!=null?String(z.v):''):'');const n=(c[0]||'').trim();if(!n||/^(oyun|oyunlar|ad|ad[ıi])$/i.test(n))return;
   if((c[4]||'').trim()){hide.add(norm(n));return}
   if(have.has(norm(n)))return;have.add(norm(n));const p=parseFloat(String(c[1]).replace(',','.')),im=(c[2]||'').trim();
   add.push({n,r:isNaN(p)?0:p,img:/^https?:\/\//.test(im)?im:im?'/kutu/img/'+im:'',u:/^https?:\/\//.test(c[3]||'')?c[3]:''})});
  all=all.filter(g=>!hide.has(norm(g.n))).concat(add.filter(g=>!hide.has(norm(g.n))));
  $('cnt').textContent=all.length;draw()}).catch(()=>{})});
</script></body></html>
