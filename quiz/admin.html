<!DOCTYPE html><html lang="tr"><head><link rel="icon" type="image/png" href="/favicon.png"><link rel="icon" href="/favicon.ico" sizes="48x48"><meta name="robots" content="noindex"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tavern Quiz - Moderatör</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="quiz.css"><script src="common.js"></script></head>
<body class="bg-slate-900 text-white min-h-screen font-sans">
<div id="login" class="max-w-md mx-auto my-20 p-6 bg-slate-800 rounded-2xl border border-slate-700 space-y-3"><h2 class="text-xl font-bold text-amber-400 text-center">Moderatör Girişi</h2>
<input id="em" type="email" placeholder="E-posta" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3"><input id="ps" type="password" placeholder="Şifre" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3">
<button onclick="login()" class="w-full bg-amber-500 font-bold py-3 text-slate-950 rounded-lg">Giriş Yap</button><p id="lerr" class="hidden text-red-400 text-xs text-center"></p></div>
<div id="dash" class="hidden max-w-xl mx-auto px-3 pb-44">
<div class="sticky top-0 z-10 bg-slate-900 pt-3 pb-2"><div class="flex items-center gap-2"><div id="chip" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm font-bold text-amber-400">Lobi</div><div id="cnt" class="text-sm font-bold text-slate-300"></div><button onclick="lobby()" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs">🚪 Lobi</button></div>
<div class="h-2 bg-slate-800 rounded-full mt-2 overflow-hidden"><div id="bar" class="h-full bg-green-500" style="width:0"></div></div></div>
<div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3 mt-2"><div class="flex justify-between text-xs text-slate-400"><b id="qn" class="text-amber-400"></b><span>Moderatör görünümü</span></div>
<h2 id="qt" class="text-xl font-bold leading-snug"></h2><div id="op" class="space-y-2"></div><p id="pl" class="text-xs text-amber-300"></p></div>
<div class="flex gap-2 mt-3"><button id="pv" onclick="mv(-1)" data-c="flex-1 py-3 rounded-xl font-bold text-sm disabled:opacity-30">← Önceki</button><button id="nx" onclick="mv(1)" data-c="flex-1 py-3 rounded-xl font-bold text-sm disabled:opacity-30">Sonraki →</button></div>
<div id="wt" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-3 mt-3 text-sm"></div>
<details id="td" class="bg-slate-800 border border-slate-700 rounded-xl p-3 mt-3"><summary id="ts" class="font-bold text-sm cursor-pointer"></summary><div id="tl" class="space-y-2 mt-2"></div></details>
<details class="bg-slate-800 border border-slate-700 rounded-xl p-3 mt-3 text-sm"><summary id="ss" class="font-bold cursor-pointer"></summary>
<div class="grid grid-cols-3 gap-2 mt-2"><input id="cn" placeholder="Etkinlik adı" class="bg-slate-900 border border-slate-700 rounded p-2"><input id="cd" placeholder="Alt başlık (Başlık 2)" class="bg-slate-900 border border-slate-700 rounded p-2"><input id="cp" placeholder="Oyuncu şifresi" class="bg-slate-900 border border-slate-700 rounded p-2"></div>
<button onclick="saveCfg()" class="bg-slate-700 px-3 py-2 rounded font-bold mt-2">Kaydet</button><p class="text-xs text-slate-400 mt-2">Sorular: Sheets › Dosya › İndir › CSV. Sütunlar: No, Soru, A, B, C, D, Doğru(A-D)</p><input type="file" accept=".csv,text/csv" onchange="loadCsv(this.files[0])" class="text-xs mt-1"><p id="msg" class="text-xs text-amber-400"></p></details>
<details class="bg-slate-800 border border-red-900 rounded-xl p-3 mt-3"><summary class="font-bold text-sm cursor-pointer text-red-400">⚠️ Tehlikeli işlemler</summary><div class="flex gap-2 mt-2"><button onclick="finish()" class="flex-1 bg-purple-700 py-3 rounded-xl text-sm font-bold">🏁 Quiz'i Bitir</button><button onclick="reset()" class="flex-1 bg-red-600 py-3 rounded-xl text-sm font-bold">Yarışmayı Sıfırla</button></div></details></div>
<div id="bb" class="hidden fixed bottom-0 inset-x-0 bg-slate-950/95 border-t border-slate-700 px-3 pt-3" style="padding-bottom:max(.75rem,env(safe-area-inset-bottom))"><div class="max-w-xl mx-auto space-y-2">
<div class="flex gap-2"><button id="b1" onclick="pub()" data-c="flex-1 py-4 rounded-xl font-bold text-sm disabled:opacity-30">① 📡 Gönder</button><button id="b2" onclick="startTimer()" data-c="flex-1 py-4 rounded-xl font-bold text-sm disabled:opacity-30">② ⏱️ Süreyi Başlat</button><button id="b3" onclick="reveal()" data-c="flex-1 py-4 rounded-xl font-bold text-sm disabled:opacity-30">③ ✅ Cevabı Aç</button></div>
<div class="flex items-center gap-2 text-xs text-slate-300"><span>Süre</span><input id="sec" type="number" value="20" min="5" max="120" class="w-16 bg-slate-800 border border-slate-700 text-center font-bold rounded-lg p-1 text-amber-400"><span>sn</span><button id="pl10" onclick="plus()" data-c="px-3 py-1.5 rounded-lg font-bold disabled:opacity-30">+10 sn</button><label class="ml-auto flex items-center gap-1"><input id="auto" type="checkbox" checked>süre bitince otomatik aç</label></div></div></div>
<script>
const auth=firebase.auth(),PTS=10;let Q=[],cur=1,st=null,teams={},sc={},ans={},tm,aR,ak,inited=0,seeded=0,res={},rR,opened="";
auth.onAuthStateChanged(u=>{const ok=u&&!u.isAnonymous;$('login').classList.toggle('hidden',ok);$('dash').classList.toggle('hidden',!ok);$('bb').classList.toggle('hidden',!ok);if(ok)init()});
function login(){auth.signInWithEmailAndPassword($('em').value.trim(),$('ps').value).catch(e=>{const m=$('lerr');m.textContent='Giriş başarısız: '+e.code;m.classList.remove('hidden')})}
function init(){if(inited++)return;
 db.ref('private/questions').on('value',s=>{const v=s.val()||[];Q=Array.isArray(v)?v.filter(Boolean):Object.values(v);draw()});
 const sync=(id,v)=>{const e=$(id);if(e&&document.activeElement!==e)e.value=v};
 db.ref('config/public').on('value',s=>{const c=s.val()||{};sync('cn',c.name||'');sync('cd',c.date||'')});
 db.ref('config/eventPassword').on('value',s=>sync('cp',s.val()||''));
 db.ref('teams').on('value',s=>{teams=s.val()||{};drawTeams();draw()});db.ref('scores').on('value',s=>{sc=s.val()||{};drawTeams()});
 db.ref('state').on('value',s=>{st=s.val();if(!seeded&&st&&st.currentQuestion){cur=st.currentQuestion;seeded=1}
  if(st&&st.qKey!==ak){if(aR)aR.off();if(rR)rR.off();ak=st.qKey;ans={};res={};if(ak){aR=db.ref('answers/'+ak);aR.on('value',a=>{ans=a.val()||{};draw()});rR=db.ref('results/'+ak);rR.on('value',a=>{res=a.val()||{};drawTeams()})}}draw()});
 setInterval(draw,500)}
function saveCfg(){db.ref().update({'config/public':{name:$('cn').value.trim(),date:$('cd').value.trim()},'config/eventPassword':$('cp').value.trim()}).then(()=>$('msg').textContent='Kaydedildi.')}
function csv(t){t=t.replace(/^\uFEFF/,'');const f=t.split('\n')[0],d=(f.match(/;/g)||[]).length>(f.match(/,/g)||[]).length?';':',',rows=[];let r=[],c='',q=0;
 for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=x}else if(x=='"')q=1;else if(x==d){r.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=x}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
function loadCsv(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{const q=csv(fr.result).map(r=>({text:(r[1]||'').trim(),A:(r[2]||'').trim(),B:(r[3]||'').trim(),C:(r[4]||'').trim(),D:(r[5]||'').trim(),correct:(r[6]||'').trim().toUpperCase()})).filter(x=>x.text&&/^[A-D]$/.test(x.correct));
 if(!q.length)return $('msg').textContent='Geçerli soru bulunamadı (7. sütun A-D olmalı).';
 db.ref('private/questions').set(q).then(()=>$('msg').textContent=q.length+' soru yüklendi.')};fr.readAsText(file)}
function mv(d){const n=cur+d;if(n<1||n>Q.length)return;cur=n;draw()}
function pub(){const q=Q[cur-1];if(!q)return;
 if(st&&st.status=='question'&&st.currentQuestion!=cur&&!confirm('Soru '+st.currentQuestion+' henüz açıklanmadı. Yine de Soru '+cur+' gönderilsin mi?'))return;
 clearTimeout(tm);db.ref('state').set({status:'question',currentQuestion:cur,qKey:'q'+cur,total:Q.length,qText:q.text,A:q.A,B:q.B,C:q.C,D:q.D,endsAt:0,dur:0})}
function lobby(){if(st&&(st.status=='question'||st.status=='revealed')&&!confirm('Oyuncular lobi ekranına dönsün mü?'))return;clearTimeout(tm);db.ref('state').update({status:'lobby',endsAt:0})}
function arm(ms){clearTimeout(tm);tm=setTimeout(()=>{if($('auto').checked)reveal()},ms+700)}
function startTimer(){if(!st||st.status!='question'||st.currentQuestion!=cur)return;const s=parseInt($('sec').value)||20;db.ref('state').update({endsAt:now()+s*1000,dur:s});arm(s*1000)}
function plus(){if(!st||st.status!='question'||!(st.endsAt>0))return;const e=Math.max(st.endsAt,now())+10000;db.ref('state').update({endsAt:e,dur:(st.dur||0)+10});arm(e-now())}
async function reveal(){clearTimeout(tm);if(!st||st.status!='question')return;const k=st.qKey,q=Q[st.currentQuestion-1];if(!q)return;
 await db.ref('state').update({status:'revealed',correct:q.correct});
 const t=await db.ref('scored/'+k).transaction(c=>c?undefined:true);if(!t.committed)return;
 const [a,tt]=await Promise.all([db.ref('answers/'+k).once('value'),db.ref('teams').once('value')]),A=a.val()||{},u={};
 Object.keys(tt.val()||{}).forEach(id=>{const c=A[id]||'-',ok=c==q.correct;u['results/'+k+'/'+id]={choice:c,ok};if(ok)u['scores/'+id]=firebase.database.ServerValue.increment(PTS)});
 db.ref().update(u)}
function finish(){if(!confirm('Quiz bitirilsin mi? Oyuncular final ekranını görecek.'))return;clearTimeout(tm);db.ref('state').update({status:'finished'})}
function reset(){if(!confirm('Tüm takımlar, cevaplar ve skorlar silinsin mi?'))return;clearTimeout(tm);cur=1;
 db.ref().update({teams:null,scores:null,answers:null,answered:null,results:null,scored:null,joins:null,state:{status:'lobby',currentQuestion:1,endsAt:0,total:Q.length}})}
function drawTeams(){const b=$('tl'),rv=!!st&&st.status=='revealed'&&st.qKey==ak&&Object.keys(res).length>0,ids=Object.keys(teams),R=u=>rv?(res[u]?(res[u].ok?1:res[u].choice=='-'?3:2):3):0,cn=c=>ids.filter(u=>R(u)==c).length;
 if(rv)ids.sort((x,y)=>R(x)-R(y));
 $('ts').textContent='👥 Takımlar · '+ids.length+(rv?' · ✅'+cn(1)+' ❌'+cn(2)+' ⚪'+cn(3):'');
 b.replaceChildren();
 if(rv){if(opened!=ak){$('td').open=true;opened=ak}
  const bx=h('div','bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm space-y-1 mb-2');bx.append(h('div','text-xs text-slate-400','Soru '+st.currentQuestion+' sonucu (cevap: '+st.correct+')'));
  [[1,'✅ Doğru','text-green-400'],[2,'❌ Yanlış','text-red-400'],[3,'⚪ Cevapsız','text-slate-400']].forEach(([c,t,k])=>{const n=ids.filter(u=>R(u)==c).map(u=>teams[u].name+(c==2?' ('+res[u].choice+')':'')),d=h('div',k);d.append(h('b','',t+' ('+n.length+'): '),h('span','text-slate-200',n.join(', ')||'-'));bx.append(d)});b.append(bx)}
 ids.forEach(u=>{
 const r=h('div','flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700 text-sm'),i=h('input','w-16 bg-slate-800 border border-slate-600 rounded text-center p-1');
 i.type='number';i.value=sc[u]||0;i.onchange=()=>db.ref('scores/'+u).set(parseInt(i.value)||0);
 const x=h('button','text-red-400 ml-2','❌');x.onclick=()=>{if(confirm(teams[u].name+' çıkarılsın mı?'))db.ref().update({['teams/'+u]:null,['scores/'+u]:null,['joins/'+u]:null})};
 const d=h('div','flex items-center');d.append(i,x);r.append(h('span','truncate',(rv?['','✅ ','❌ ','⚪ '][R(u)]:'')+teams[u].name),d);b.append(r)})}
function sb(id,on,hl){const b=$(id);b.disabled=!on;b.className=b.dataset.c+(hl?' bg-amber-500 text-slate-950 ring-2 ring-amber-300':' bg-slate-700 text-slate-200')}
function draw(){const q=Q[cur-1],s=st||{},live=s.status=='question',rev=s.status=='revealed',same=s.currentQuestion==cur,cs=(live||rev)&&same,lv=live&&same,l=left(s),ms=s.endsAt>0?s.endsAt-now():null,n=Object.keys(teams).length,k=Object.keys(ans).length;
 $('chip').textContent=live?'Soru '+s.currentQuestion+' gönderildi'+(l===null?' · süre başlamadı':l>0?' · ⏱ '+l+' sn':' · süre bitti'):rev?'Soru '+s.currentQuestion+' · cevap açıldı':s.status=='finished'?'Quiz bitti':'Lobi';
 $('cnt').textContent=cs?k+'/'+n+' cevap':'';
 const bar=$('bar');bar.style.width=live&&ms!==null&&s.dur?Math.max(0,ms/(s.dur*10))+'%':live?'100%':'0%';bar.className='h-full '+(l!==null&&l<=5?'bg-red-500':'bg-green-500');
 $('qn').textContent='Soru '+cur+' / '+(Q.length||'?');$('qt').textContent=q?q.text:'Soru yok. Ayarlar bölümünden CSV yükleyin.';
 const op=$('op');op.replaceChildren();if(q)L.forEach(o=>op.append(h('div','p-3 rounded-xl border '+(o==q.correct?'border-green-500 bg-green-500/20 text-green-300 font-bold':'border-slate-700 bg-slate-900 text-slate-300'),o+') '+q[o]+(o==q.correct?'  ✓ doğru':''))));
 $('pl').textContent=(live||rev)&&!same?'Oyuncular şu an Soru '+s.currentQuestion+' ekranında. Gönder\'e basana kadar Soru '+cur+' onlara görünmez.':'';
 const wt=$('wt');wt.classList.toggle('hidden',!lv);if(lv){const w=Object.keys(teams).filter(u=>!ans[u]);wt.replaceChildren(h('div','text-xs text-slate-400 mb-1',w.length?'Cevap bekleyenler ('+w.length+')':'Herkes cevapladı ✓'),...w.map(u=>h('span','inline-block bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 mr-1 mb-1 text-xs',teams[u].name)))}
 sb('b1',!!q,!cs);sb('b2',lv,lv&&l===null);sb('b3',lv,lv&&l!==null);sb('pl10',lv&&l!==null,false);sb('pv',cur>1,false);sb('nx',cur<Q.length,rev&&same&&cur<Q.length);
 $('ss').textContent='⚙️ Ayarlar · ✓ '+Q.length+' soru yüklü'}
</script></body></html>
