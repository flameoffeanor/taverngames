<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavern Quiz - Moderatör Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans">

  <!-- ADMIN LOGIN -->
  <div id="adminLogin" class="max-w-md mx-auto my-20 bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
    <h2 class="text-xl font-bold text-amber-400 text-center">Moderatör Girişi</h2>
    <input type="password" id="adminPass" placeholder="Admin Şifresi" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white">
    <button onclick="loginAdmin()" class="w-full bg-amber-500 font-bold py-3 text-slate-950 rounded-lg">Giriş Yap</button>
    <p id="adminErr" class="text-red-400 text-xs text-center hidden">Şifre Yanlış!</p>
  </div>

  <!-- ADMIN DASHBOARD (Çift Kolonlu Yapı) -->
  <div id="adminDashboard" class="hidden max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- SOL KOLON: KUMANDA PANELİ (7 Kolon) -->
    <div class="lg:col-span-7 space-y-6">
      <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div>
          <h1 class="font-bold text-lg text-amber-400">Moderatör Kumanda Paneli</h1>
          <p id="totalQInfo" class="text-xs text-slate-400">Yüklenen Soru Sayısı: ...</p>
        </div>
        <button onclick="resetGame()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-2 rounded-lg font-bold">Yarışmayı Sıfırla</button>
      </div>

      <!-- KONTROL BUTONLARI -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="setStatus('lobby')" class="bg-slate-800 border border-slate-700 p-3 rounded-xl font-semibold hover:border-amber-400">🚪 Lobiyi Aç</button>
        <button onclick="sendQuestion()" class="bg-amber-500 text-slate-950 p-3 rounded-xl font-bold hover:bg-amber-400">📡 Soruyu Gönder</button>
        <button onclick="startTimer(30)" class="bg-blue-600 p-3 rounded-xl font-bold hover:bg-blue-500">⏱️ Süreyi Başlat (30s)</button>
        <button onclick="revealAnswer()" class="bg-green-600 p-3 rounded-xl font-bold hover:bg-green-500">✅ Cevabı Açıkla (+10 Puan)</button>
      </div>

      <!-- SORU NAVİGASYON VE QUİZ BİTİR -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
        <button onclick="changeQ(-1)" class="bg-slate-700 px-4 py-2 rounded-lg text-sm font-bold">Önceki Soru</button>
        <span id="currentQDisplay" class="font-bold text-lg text-amber-400">Soru 1</span>
        <button onclick="changeQ(1)" class="bg-slate-700 px-4 py-2 rounded-lg text-sm font-bold">Sonraki Soru</button>
      </div>

      <button onclick="finishQuiz()" class="w-full bg-purple-700 hover:bg-purple-600 p-3 rounded-xl font-bold text-sm">🏁 Quiz'i Bitir (Ekranı Kapat)</button>

      <!-- CANLI YANIT SAYACI & TAKIMLAR -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <h3 class="font-bold text-xs uppercase text-slate-400 mb-2">Katılan Takımlar & Puanlar</h3>
          <div id="teamsAdminList" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <h3 class="font-bold text-xs uppercase text-slate-400 mb-2">Gelen Cevaplar</h3>
          <div id="answersCount" class="text-2xl font-bold text-amber-400 mb-2">0 Takım Cevap Verdi</div>
          <div id="answersAdminList" class="space-y-1 text-xs text-slate-300"></div>
        </div>
      </div>
    </div>

    <!-- SAĞ KOLON: OYUNCU CANLI ÖNİZLEME SIMULATOR (5 Kolon) -->
    <div class="lg:col-span-5 space-y-3">
      <div class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
        <span>📱 Oyuncu Ekranı Canlı Önizleme</span>
        <span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
      </div>
      
      <!-- TELEFON KAFESİ -->
      <div class="bg-slate-950 p-4 rounded-3xl border-4 border-slate-800 shadow-2xl min-h-[500px] flex flex-col justify-between">
        <div class="border-b border-slate-800 pb-2 mb-3 flex justify-between items-center text-xs text-slate-400">
          <span class="font-bold text-amber-400">Tavern Quiz</span>
          <span class="bg-slate-800 px-2 py-0.5 rounded text-[10px]">Örnek Takım (Önizleme)</span>
        </div>

        <!-- ÖNİZLEME DİNAMİK İÇERİK -->
        <div id="previewContainer" class="my-auto space-y-4">
          <div class="text-center text-slate-500 text-sm">Yükleniyor...</div>
        </div>

        <div class="text-center text-[10px] text-slate-600 pt-3 border-t border-slate-800">
          Oyuncuların telefonunda şu an anlık görünen ekran
        </div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtHAhzYNDf7PHrj-48EelC6OQtp3pkv4E",
      authDomain: "tavern-quiz.firebaseapp.com",
      databaseURL: "https://tavern-quiz-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tavern-quiz",
      storageBucket: "tavern-quiz.firebasestorage.app",
      messagingSenderId: "280835700622",
      appId: "1:280835700622:web:043d61c02d689de87056df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const SHEET_ID = "1dkkG5g3A1aoiWf2Y9FdWg6LZ3TeQTTHemC2YNQ0HDGs";
    let adminPassReal = "";
    let currentQ = 1;
    let timerInterval = null;
    let questionsData = [];

    async function loadSheetData() {
      const urlA = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Ayarlar`;
      const resA = await fetch(urlA);
      const textA = await resA.text();
      const jsonA = JSON.parse(textA.substring(47, textA.length - 2));
      jsonA.table.rows.forEach(r => {
        if (r.c[0]?.v === "Admin_Sifresi") adminPassReal = r.c[1]?.v;
      });

      const urlS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sorular`;
      const resS = await fetch(urlS);
      const textS = await resS.text();
      const jsonS = JSON.parse(textS.substring(47, textS.length - 2));
      
      questionsData = jsonS.table.rows
        .filter(r => r.c && r.c[1] && r.c[1].v && r.c[1].v.toString().trim() !== "")
        .map(r => ({
          no: r.c[0]?.v,
          text: r.c[1]?.v,
          A: r.c[2]?.v,
          B: r.c[3]?.v,
          C: r.c[4]?.v,
          D: r.c[5]?.v,
          correct: r.c[6]?.v
        }));

      document.getElementById("totalQInfo").innerText = `Dolu Soru Sayısı: ${questionsData.length}`;
    }
    loadSheetData();

    function loginAdmin() {
      const input = document.getElementById("adminPass").value;
      if (input === adminPassReal && adminPassReal !== "") {
        document.getElementById("adminLogin").classList.add("hidden");
        document.getElementById("adminDashboard").classList.remove("hidden");
        document.getElementById("adminDashboard").classList.add("grid");
        initAdminListeners();
      } else {
        document.getElementById("adminErr").classList.remove("hidden");
      }
    }

    function initAdminListeners() {
      db.ref("teams").on("value", snap => {
        const teams = snap.val() || {};
        const list = document.getElementById("teamsAdminList");
        list.innerHTML = "";
        Object.keys(teams).forEach(t => {
          list.innerHTML += `
            <div class="flex justify-between items-center text-sm bg-slate-900 p-2 rounded border border-slate-700">
              <span>${t}</span>
              <div class="flex items-center gap-2">
                <input type="number" value="${teams[t].score || 0}" onchange="updateScore('${t}', this.value)" class="w-16 bg-slate-800 border border-slate-600 rounded text-center text-xs p-1">
                <button onclick="kickTeam('${t}')" class="text-red-400 hover:text-red-600 text-xs">❌</button>
              </div>
            </div>`;
        });
      });

      db.ref("state/currentQuestion").on("value", snap => {
        currentQ = snap.val() || 1;
        document.getElementById("currentQDisplay").innerText = `Soru ${currentQ} / ${questionsData.length || '?'}`;
        listenAnswers();
      });

      // CANLI OYUNCU EKRANI ÖNİZLEME DİNLEYİCİSİ
      db.ref("state").on("value", snap => {
        renderLivePreview(snap.val());
      });
    }

    function renderLivePreview(state) {
      const pBox = document.getElementById("previewContainer");
      if (!state) return;

      if (state.status === "lobby") {
        pBox.innerHTML = `
          <div class="text-center space-y-3">
            <div class="text-3xl animate-bounce">⏳</div>
            <div class="font-bold text-amber-400 text-lg">Lobi Ekranı</div>
            <p class="text-xs text-slate-400">Oyuncular moderatörün yarışmayı başlatmasını bekliyor...</p>
          </div>`;
      } else if (state.status === "finished") {
        pBox.innerHTML = `
          <div class="text-center space-y-3">
            <div class="text-4xl">🏆</div>
            <div class="font-bold text-amber-400 text-lg">Quiz Sona Erdi</div>
            <p class="text-xs text-slate-300">Final Puan Tablosu Gösteriliyor.</p>
          </div>`;
      } else if (state.status === "question" || state.status === "revealed") {
        const qIndex = state.currentQuestion - 1;
        const q = questionsData[qIndex];
        if (!q) return;

        let timerText = "Bekleniyor...";
        let timerColor = "text-slate-400";
        if (state.timeLeft > 0) {
          timerText = `${state.timeLeft}s`;
          timerColor = "text-amber-400 font-bold animate-pulse";
        } else if (state.timerStarted && state.timeLeft === 0) {
          timerText = "Süre Bitti";
          timerColor = "text-red-400 font-bold";
        }

        let optionsHtml = "";
        ["A", "B", "C", "D"].forEach(opt => {
          let btnStyle = "bg-slate-900 border-slate-800 text-slate-300";
          let badge = "";

          if (state.status === "revealed") {
            if (opt === q.correct) {
              btnStyle = "bg-green-500/20 border-green-500 text-green-400 font-bold";
              badge = "✅";
            } else {
              btnStyle = "bg-slate-900/50 border-slate-800 opacity-40";
            }
          }

          optionsHtml += `
            <div class="p-2.5 rounded-lg border text-xs flex justify-between items-center ${btnStyle}">
              <span>${opt}) ${q[opt]}</span>
              <span>${badge}</span>
            </div>`;
        });

        pBox.innerHTML = `
          <div class="space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2 text-xs">
              <span class="font-bold text-amber-400">Soru ${state.currentQuestion}</span>
              <span class="${timerColor}">${timerText}</span>
            </div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-sm font-semibold leading-snug">
              ${q.text}
            </div>
            <div class="space-y-2">
              ${optionsHtml}
            </div>
          </div>`;
      }
    }

    function listenAnswers() {
      db.ref(`answers/q${currentQ}`).on("value", snap => {
        const ans = snap.val() || {};
        const count = Object.keys(ans).length;
        document.getElementById("answersCount").innerText = `${count} Takım Cevap Verdi`;
        const list = document.getElementById("answersAdminList");
        list.innerHTML = "";
        Object.keys(ans).forEach(t => {
          list.innerHTML += `<div class="flex justify-between border-b border-slate-700/40 py-1"><span>${t}</span><span class="font-bold text-amber-400">${ans[t]}</span></div>`;
        });
      });
    }

    function setStatus(st) {
      db.ref("state/status").set(st);
    }

    function sendQuestion() {
      clearInterval(timerInterval);
      db.ref("state").update({
        status: "question",
        currentQuestion: currentQ,
        timeLeft: 0,
        timerStarted: false
      });
    }

    function startTimer(sec) {
      let left = sec;
      clearInterval(timerInterval);
      db.ref("state").update({
        timeLeft: left,
        timerStarted: true
      });
      timerInterval = setInterval(() => {
        left--;
        db.ref("state/timeLeft").set(left);
        if (left <= 0) clearInterval(timerInterval);
      }, 1000);
    }

    function revealAnswer() {
      clearInterval(timerInterval);
      db.ref("state").update({
        status: "revealed",
        timeLeft: 0,
        timerStarted: true
      });

      const currentCorrect = questionsData[currentQ - 1]?.correct;
      if (!currentCorrect) return;

      db.ref(`answers/q${currentQ}`).once("value", snap => {
        const answers = snap.val() || {};
        db.ref("teams").once("value", tSnap => {
          const teams = tSnap.val() || {};
          Object.keys(answers).forEach(teamName => {
            if (answers[teamName] === currentCorrect && teams[teamName]) {
              const currentScore = teams[teamName].score || 0;
              db.ref(`teams/${teamName}/score`).set(currentScore + 10);
            }
          });
        });
      });
    }

    function changeQ(dir) {
      const targetQ = currentQ + dir;
      if (targetQ < 1) return;
      if (targetQ > questionsData.length) {
        if (confirm("Tüm sorular bitti! Quiz bitiş ekranına geçilsin mi?")) {
          finishQuiz();
        }
        return;
      }
      currentQ = targetQ;
      db.ref("state").update({
        currentQuestion: currentQ,
        status: "question",
        timeLeft: 0,
        timerStarted: false
      });
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      db.ref("state").update({
        status: "finished"
      });
    }

    function updateScore(team, newScore) {
      db.ref(`teams/${team}/score`).set(parseInt(newScore) || 0);
    }

    function kickTeam(team) {
      if (confirm(`${team} grubunu çıkarmak istediğinize emin misiniz?`)) {
        db.ref(`teams/${team}`).remove();
      }
    }

    function resetGame() {
      if (confirm("Tüm yarışma verilerini ve skorları sıfırlamak istediğinize emin misiniz?")) {
        clearInterval(timerInterval);
        db.ref().set({
          state: { status: "lobby", currentQuestion: 1, timeLeft: 0, timerStarted: false },
          teams: {},
          answers: {}
        });
      }
    }
  </script>
</body>
</html>
