<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tavern Quiz - Projeksiyon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="common.js"></script></head>
<body class="bg-slate-950 text-white min-h-screen p-6 font-sans overflow-hidden flex flex-col">
<header class="flex justify-between items-center border-b-2 border-slate-800 pb-3 mb-4"><div class="flex items-center gap-4"><div class="bg-amber-500 text-slate-950 font-black px-4 py-1.5 rounded-xl text-xl">TAVERN QUIZ</div><h1 id="ev" class="text-2xl font-bold text-slate-200"></h1></div>
<div id="qnum" class="text-xl font-black text-amber-400 bg-slate-900 px-6 py-2 rounded-2xl border-2 border-slate-800">Lobi</div></header>
<main id="lobby" class="my-auto text-center space-y-8 max-w-5xl mx-auto w-full"><div class="text-7xl animate-bounce">⏳</div><h2 class="text-5xl font-black text-amber-400">Yarışma Birazdan Başlıyor!</h2><p class="text-2xl text-slate-300">taverngames.com.tr/quiz adresinden giriş yapıp takım isminizi yazınız.</p>
<div id="tt" class="grid grid-cols-3 md:grid-cols-4 gap-4 text-lg"></div></main>
<main id="quiz" class="hidden my-auto grid-cols-12 gap-6 max-w-[1600px] mx-auto w-full">
<div class="col-span-8 space-y-4"><div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border-2 border-slate-800"><div class="text-slate-300 font-bold text-lg">Gelen Yanıt: <b id="got" class="text-amber-400 text-2xl">0</b> / <b id="all">0</b> Takım</div><div id="timer" class="font-mono font-black text-5xl text-amber-400"></div></div>
<h2 id="qt" class="bg-slate-900 p-6 rounded-3xl border-2 border-slate-800 text-center text-4xl font-extrabold leading-snug"></h2>
<div id="op" class="grid grid-cols-2 gap-4 text-xl font-bold"></div><div id="bd" class="flex flex-wrap justify-center gap-2 max-h-36 overflow-y-auto"></div></div>
<div class="col-span-4 bg-slate-900 p-5 rounded-3xl border-2 border-slate-800"><div class="text-sm font-black uppercase tracking-widest text-amber-400 mb-4 text-center">🏆 Canlı Skor Tablosu (İlk 10)</div><div id="lb" class="text-base"></div></div></main>
<main id="fin" class="hidden my-auto text-center space-y-6 max-w-3xl mx-auto w-full"><div class="text-9xl">🏆</div><h2 class="text-6xl font-black text-amber-400">QUIZ SONA ERDİ!</h2><div id="ff" class="bg-slate-900 p-8 rounded-3xl border-2 border-slate-800 text-left text-2xl"></div></main>
<script>
let teams={},sc={},st=null,ans={},res={},k=null,r1,r2;
db.ref('config/public').on('value',s=>$('ev').textContent=(s.val()||{}).name||'Quiz Night');
db.ref('teams').on('value',s=>{teams=s.val()||{};draw()});db.ref('scores').on('value',s=>{sc=s.val()||{};draw()});
db.ref('state').on('value',s=>{st=s.val();const nk=st&&st.qKey;if(nk!==k){if(r1)r1.off();if(r2)r2.off();k=nk;ans={};res={};
 if(k){r1=db.ref('answered/'+k);r1.on('value',a=>{ans=a.val()||{};draw()});r2=db.ref('results/'+k);r2.on('value',a=>{res=a.val()||{};draw()})}}draw()});
setInterval(()=>{const l=left(st);$('timer').textContent=st&&st.status=='question'?(l===null?'--':l>0?l+'s':'Süre Bitti'):st&&st.status=='revealed'?'Süre Bitti':''},250);
function show(id){['lobby','quiz','fin'].forEach(x=>$(x).classList.toggle('hidden',x!=id));$('quiz').classList.toggle('grid',id=='quiz')}
function draw(){const s=st||{},rev=s.status=='revealed';
 $('qnum').textContent=s.status=='question'||rev?'Soru '+s.currentQuestion+' / '+s.total:s.status=='finished'?'Sonuçlar':'Lobi';
 if(s.status=='finished'){show('fin');board($('ff'),teams,sc,null)}
 else if(s.status=='question'||rev){show('quiz');$('qt').textContent=s.qText;
  const o=$('op');o.replaceChildren();L.forEach(x=>o.append(h('div','p-5 rounded-2xl border '+(rev?(x==s.correct?'bg-green-500/25 border-4 border-green-500 text-green-300 font-black':'bg-slate-900 border-slate-800 opacity-30'):'bg-slate-900 border-slate-800'),x+') '+s[x]+(rev&&x==s.correct?'  ✅':''))));
  $('got').textContent=Object.keys(ans).length;$('all').textContent=Object.keys(teams).length;
  const b=$('bd');b.replaceChildren();Object.keys(teams).forEach(u=>{let c='bg-slate-800 text-slate-400',t='⏳';
   if(rev){const r=res[u];if(r&&r.ok){c='bg-green-500/30 text-green-300';t='✅ '+r.choice}else if(r&&r.choice!='-'){c='bg-red-500/30 text-red-300';t='❌ '+r.choice}else{c='bg-slate-900 text-slate-600';t='⚪'}}
   else if(ans[u]){c='bg-amber-500/30 text-amber-300';t='🔒'}
   b.append(h('span','px-3 py-1.5 rounded-xl text-xs font-bold '+c,teams[u].name+' '+t))});
  board($('lb'),teams,sc,null,10)}
 else{show('lobby');$('tt').replaceChildren(...Object.values(teams).map(t=>h('div','bg-slate-800 p-4 rounded-2xl text-amber-300 font-bold','🛡️ '+t.name)))}}
</script></body></html>
