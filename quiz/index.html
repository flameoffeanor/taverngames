<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tavern Games - Quiz Night</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="common.js"></script></head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans max-w-md mx-auto">
<header class="flex justify-between items-center border-b border-slate-700 pb-3 mb-4"><b class="text-amber-400 text-lg">Tavern Quiz</b>
<span id="me" class="hidden text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-700"><span id="mn" class="text-amber-300 font-semibold"></span> <button onclick="out()" class="text-xs text-red-400 ml-1">Çıkış</button></span></header>
<main id="login" class="space-y-3 bg-slate-800 p-6 rounded-2xl border border-slate-700">
<h1 id="title" class="text-2xl font-extrabold text-center text-amber-400">Quiz Night</h1><p id="date" class="text-xs text-center text-slate-400"></p>
<input id="pw" type="password" placeholder="Etkinlik şifresi" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-amber-400">
<input id="tn" maxlength="24" placeholder="Grup / Takım ismi" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-amber-400">
<button id="bj" onclick="go()" class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-3 rounded-lg text-slate-950">Odaya Katıl</button><p id="err" class="text-red-400 text-xs text-center"></p></main>
<main id="lobby" class="hidden text-center bg-slate-800 p-6 rounded-2xl border border-slate-700"><div class="text-4xl animate-pulse">⏳</div><h2 class="font-bold text-xl my-2">Lobiye Katıldınız!</h2><p class="text-sm text-slate-400 mb-4">Moderatör yarışmayı başlatana kadar bekleyiniz...</p>
<ul id="tl" class="text-left text-sm bg-slate-900 p-4 rounded-lg max-h-48 overflow-y-auto space-y-1"></ul></main>
<main id="quiz" class="hidden space-y-3"><div class="flex justify-between bg-slate-800 p-3 rounded-xl border border-slate-700"><b id="qn" class="text-amber-400 text-sm"></b><b id="timer" class="font-mono text-amber-400"></b></div>
<h3 id="qt" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-lg font-semibold"></h3><div id="opts" class="grid gap-3"></div>
<p id="toast" class="text-center text-xs text-red-400"></p>
<div id="foot" class="hidden space-y-2"><div id="fbk" class="text-center font-bold py-2 rounded-lg bg-slate-800"></div>
<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-sm"><b class="text-xs uppercase text-slate-400">Canlı Sıralama</b><div id="lb"></div></div></div></main>
<main id="fin" class="hidden text-center bg-slate-800 p-6 rounded-2xl border border-slate-700"><div class="text-5xl">🏆</div><h2 class="text-2xl font-black text-amber-400">Quiz Sona Erdi!</h2><p class="text-sm text-slate-300 mb-3">Katılımınız için teşekkür ederiz!</p><div id="fb" class="text-left text-sm"></div></main>
<script>
const auth=firebase.auth();let uid,teams={},sc={},st=null,mine=null,qKey=null,aRef=null,joined=false,started=0,lastUp=null;
auth.onAuthStateChanged(u=>{
 if(!u)return auth.signInAnonymously().catch(()=>$('err').textContent='Bağlantı kurulamadı, sayfayı yenileyin.');
 if(!u.isAnonymous){$('err').textContent='Bu tarayıcıda moderatör girişi açık. Oyuncu ekranını gizli pencerede açın.';$('bj').disabled=true;return}
 uid=u.uid;if(started++)return;
 db.ref('config/public').on('value',s=>{const c=s.val()||{};$('title').textContent=c.name||'Quiz Night';$('date').textContent=c.date||''});
 db.ref('teams').on('value',s=>{teams=s.val()||{};joined=!!teams[uid];render()});
 db.ref('scores').on('value',s=>{sc=s.val()||{};render()});
 db.ref('state').on('value',s=>{st=s.val();watch();render()});
 setInterval(tick,250)});
function watch(){const k=st&&st.qKey;if(k===qKey)return;if(aRef)aRef.off();qKey=k;mine=null;if(!k)return;aRef=db.ref('answers/'+k+'/'+uid);aRef.on('value',s=>{mine=s.val();render()})}
function show(id){document.querySelectorAll('main').forEach(m=>m.classList.toggle('hidden',m.id!=id))}
function tick(){if(!st)return;const l=left(st),up=st.status=='question'&&l!==null&&l<=0;
 $('timer').textContent=st.status=='revealed'||up?'Süre Bitti':l===null?'Bekleniyor...':l+'s';if(up!==lastUp){lastUp=up;render()}}
function render(){
 $('me').classList.toggle('hidden',!joined);if(joined)$('mn').textContent=teams[uid].name;
 board($('lb'),teams,sc,uid);board($('fb'),teams,sc,uid);$('tl').replaceChildren(...Object.values(teams).map(t=>h('li','text-slate-300',t.name)));
 if(!st)return show('login');if(st.status=='finished')return show('fin');if(!joined)return show('login');if(st.status=='lobby')return show('lobby');
 show('quiz');const rev=st.status=='revealed',l=left(st),up=l!==null&&l<=0;
 $('qn').textContent='Soru '+st.currentQuestion+' / '+st.total;$('qt').textContent=st.qText;
 const box=$('opts');box.replaceChildren();
 L.forEach(o=>{const ok=rev&&o==st.correct,bad=rev&&o==mine&&o!=st.correct;
  const b=h('button','w-full text-left p-4 rounded-xl border bg-slate-800 disabled:opacity-80 '+(ok?'border-green-500 !bg-green-500/20 text-green-400 font-bold':bad?'border-red-500 !bg-red-500/20 text-red-400':o==mine?'border-amber-400 !bg-amber-500/25 text-amber-300 font-bold':'border-slate-700'),o+') '+st[o]+(ok?'  ✅':bad?'  ❌':o==mine?'  ✔':''));
  b.disabled=rev||up;b.onclick=()=>pick(o);box.append(b)});
 $('foot').classList.toggle('hidden',!rev);
 $('fbk').textContent=mine==st.correct?'Tebrikler! Doğru Cevap 🎉':mine?'Maalesef Yanlış Cevap ❌':'Cevap vermediniz'}
function pick(o){$('toast').textContent='';db.ref().update({['answers/'+qKey+'/'+uid]:o,['answered/'+qKey+'/'+uid]:true}).catch(()=>{$('toast').textContent='Süre doldu, cevap kaydedilmedi.'})}
async function go(){const p=$('pw').value.trim(),n=$('tn').value.trim().slice(0,24),e=$('err');e.textContent='';
 if(!n)return e.textContent='Lütfen grup isminizi giriniz!';
 try{await db.ref('joins/'+uid).set(p)}catch(x){return e.textContent='Etkinlik şifresi hatalı!'}
 const low=Object.values(teams).map(t=>t.name.toLowerCase());let f=n,i=1;while(low.includes(f.toLowerCase()))f=n+' '+(++i);
 db.ref('teams/'+uid).set({name:f}).catch(()=>e.textContent='Katılım başarısız, tekrar deneyin.')}
function out(){if(confirm('Çıkış yapmak istediğinize emin misiniz?'))db.ref('teams/'+uid).remove()}
</script></body></html>
