name: Kutu oyunları listesini güncelle
on:
  schedule: [{cron: '0 3 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_kutu.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kutu/index.html
          git diff --cached --quiet || (git commit -m "Kutu oyunları listesi güncellendi" && git push)
