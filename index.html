<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavern Games - Karakter Referansı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #18181c;
      --border-color: #2a2a32;
      --text-main: #e2e2e8;
      --text-muted: #9a9a9f;
      --accent-gold: #d4af37;
      
      --team-townsfolk: #2980b9;
      --team-outsider: #16a085;
      --team-minion: #8e44ad;
      --team-demon: #c0392b;
      --team-traveler: #d35400;
      --team-fables: #f39c12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 10px 0 20px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    
    header img.logo {
      max-width: 130px;
      height: auto;
      margin-bottom: 8px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--accent-gold);
      letter-spacing: 1px;
    }

    /* Instagram Bağlantı Stili */
    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .instagram-link:hover {
      color: var(--accent-gold);
    }

    .instagram-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Link Yapıştırma Alanı */
    .input-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-section label {
      font-size: 0.85rem;
      color: var(--accent-gold);
      font-weight: 600;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    .input-section input {
      flex: 1;
      background: #0f0f11;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .input-section input:focus {
      border-color: var(--accent-gold);
    }

    .input-section button {
      background: var(--accent-gold);
      color: #0f0f11;
      border: none;
      border-radius: 6px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .input-section button:hover {
      background: #c5a028;
    }

    /* Rol Dağılım Tablosu */
    #distribution-container {
      display: none;
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
    }

    .dist-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.85rem;
      min-width: 500px;
    }

    .dist-table th, .dist-table td {
      border: 1px solid var(--border-color);
      padding: 8px 4px;
    }

    .dist-table th {
      background: rgba(212, 175, 55, 0.1);
      color: var(--text-main);
      font-weight: 700;
    }
    
    .dist-table td:first-child {
      text-align: left;
      font-weight: 700;
      padding-left: 8px;
    }
