<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavern Games - BotC Script & Rol Rehberi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0f12;
      --card-bg: #161920;
      --card-border: #2a2e39;
      --gold-primary: #f3c649;
      --gold-hover: #ffd972;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --townsfolk-color: #2563eb;
      --outsider-color: #0284c7;
      --minion-color: #dc2626;
      --demon-color: #991b1b;
      --traveller-color: #7c3aed;
      --fabled-color: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      text-align: center;
      padding: 30px 15px 20px;
      border-bottom: 1px solid var(--card-border);
      background: linear-gradient(180deg, #13161c 0%, var(--bg-dark) 100%);
    }
    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      color: var(--gold-primary);
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .social-card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .social-card:hover {
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }
    .social-card.instagram { border-left: 4px solid #e1306c; }
    .social-card.whatsapp { border-left: 4px solid #25d366; }
    .social-icon { font-size: 1.5rem; }
    .social-text h3 { font-size: 1rem; font-weight: 600; }
    .social-text p { font-size: 0.8rem; color: var(--text-muted); }

    .input-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .input-group {
      display: flex;
      gap: 10px;
    }
    .input-group input {
      flex: 1;
      background: #090a0c;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 15px;
      color: #fff;
      font-size: 0.95rem;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--gold-primary);
    }
    .btn-submit {
      background: var(--gold-primary);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 0 25px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--gold-hover); }

    .scripts-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--card-border);
    }
    .scripts-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .scripts-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-script {
      background: #1c202a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .btn-script:hover {
      background: #252a37;
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      transform: translateX(3px);
    }
    .btn-script::after {
      content: "➔";
      font-size: 0.85rem;
      opacity: 0.6;
    }

    #role-list-view { display: none; }
    
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--card-border);
    }
    .btn-back {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-back:hover { color: #fff; border-color: #fff; }

    .search-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 15px;
      color: #fff;
      margin-bottom: 20px;
    }

    .team-title {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      margin: 25px 0 12px;
      padding-bottom: 5px;
      border-bottom: 2px solid currentColor;
    }
    .team-townsfolk { color: var(--townsfolk-color); }
    .team-outsider { color: var(--outsider-color); }
    .team-minion { color: var(--minion-color); }
    .team-demon { color: var(--demon-color); }
    .team-traveller { color: var(--traveller-color); }
    .team-fabled { color: var(--fabled-color); }

    .role-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
    }
    .role-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .role-name {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .role-team-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .role-ability {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .loading-spinner {
      text-align: center;
      padding: 15px;
      color: var(--gold-primary);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tavern Games</h1>
    <p>Blood on the Clocktower - Kasaba Rehberi</p>
  </header>

  <div class="container">
    
    <!-- ANA SAYFA -->
    <div id="home-view">
      
      <div class="social-links">
        <a href="https://instagram.com/taverngamesclub" target="_blank" class="social-card instagram">
          <div class="social-icon">📸</div>
          <div class="social-text">
            <h3>Instagram'da Bizi Takip Edin</h3>
            <p>@taverngamesclub</p>
          </div>
        </a>
        <a href="https://chat.whatsapp.com/YOUR_GROUP_LINK" target="_blank" class="social-card whatsapp">
          <div class="social-icon">💬</div>
          <div class="social-text">
            <h3>WhatsApp Grubumuza Katılın</h3>
            <p>Oyun duyuruları ve topluluk grubu</p>
          </div>
        </a>
      </div>

      <div class="input-section">
        <div class="input-group">
          <input type="text" id="script-input" placeholder="Pocket Grimoire linki veya JSON yapıştırın...">
          <button class="btn-submit" onclick="handleCustomInput()">Getir</button>
        </div>

        <div class="scripts-container">
          <div class="scripts-title">HAZIR SCRİPTLER</div>
          <div id="scripts-list-loading" class="loading-spinner">Scriptler yükleniyor...</div>
          <div id="scripts-buttons-group" class="scripts-grid"></div>
        </div>
      </div>

    </div>

    <!-- ROL LİSTESİ EKRANI -->
    <div id="role-list-view">
      <div class="view-header">
        <button class="btn-back" onclick="showHomeView()">← Ana Menüye Dön</button>
        <h2 id="current-script-name" style="font-family:'Cinzel', serif; color:var(--gold-primary);">Script</h2>
      </div>

      <input type="text" id="search-input" class="search-box" placeholder="Rol ara..." oninput="filterRoles()">

      <div id="roles-container"></div>
    </div>

  </div>

  <script>
    const SHEETS_ID = '1CvS4Fa1Aht6-KG1EVdSeCiT3nUsBqZ2arLMqKSxxviY';
    const ROLES_GID = '0';
    const SCRIPTS_GID = '1395107313';

    let allRolesDatabase = {};
    let currentScriptRoles = [];

    window.addEventListener('DOMContentLoaded', async () => {
      await fetchRolesDatabase();
      await fetchScriptsList();
    });

    async function fetchRolesDatabase() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:json&gid=${ROLES_GID}`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47, text.length - 2));
        
        const rows = json.table.rows;
        rows.forEach(row => {
          const id = row.c[0]?.v?.toString().trim().toLowerCase();
          if (id) {
            allRolesDatabase[id] = {
              id: id,
              name: row.c[1]?.v || id,
              team: row.c[2]?.v?.toString().trim().toLowerCase() || 'townsfolk',
              ability: row.c[3]?.v || ''
            };
          }
        });
      } catch (err) {
        console.error("Karakter veritabanı hatası:", err);
      }
    }

    async function fetchScriptsList() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:json&gid=${SCRIPTS_GID}`;
      const loadingEl = document.getElementById('scripts-list-loading');
      const groupEl = document.getElementById('scripts-buttons-group');

      try {
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47, text.length - 2));
        
        const rows = json.table.rows;
        groupEl.innerHTML = '';

        rows.forEach(row => {
          const name = row.c[0]?.v?.toString().trim();
          const jsonContent = row.c[1]?.v?.toString().trim();

          // Sadece başlık olmayan geçerli verileri ekle
          if (name && jsonContent && name.toLowerCase() !== 'script_name') {
            const btn = document.createElement('button');
            btn.className = 'btn-script';
            btn.innerText = name;
            btn.onclick = () => loadScriptData(name, jsonContent);
            groupEl.appendChild(btn);
          }
        });

        loadingEl.style.display = 'none';
      } catch (err) {
        console.error("Script listesi hatası:", err);
        loadingEl.innerText = "Scriptler yüklenemedi.";
      }
    }

    function loadScriptData(scriptName, rawData) {
      document.getElementById('current-script-name').innerText = scriptName;
      let roleIds = [];

      try {
        if (rawData.startsWith('[')) {
          const parsed = JSON.parse(rawData);
          roleIds = parsed
            .map(item => typeof item === 'string' ? item : item.id)
            .filter(id => id && id !== '_meta');
        } else {
          roleIds = rawData.split(',').map(id => id.trim().toLowerCase());
        }
      } catch (e) {
        alert("Script formatı geçersiz!");
        return;
      }

      currentScriptRoles = roleIds
        .map(id => allRolesDatabase[id.toLowerCase()] || { id: id, name: id, team: 'townsfolk', ability: 'Açıklama bulunamadı.' });

      renderRoleList(currentScriptRoles);
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('role-list-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function handleCustomInput() {
      const input = document.getElementById('script-input').value.trim();
      if (!input) return;
      loadScriptData("Özel Script", input);
    }

    function renderRoleList(roles) {
      const container = document.getElementById('roles-container');
      container.innerHTML = '';

      const teamsOrder = [
        { id: 'townsfolk', title: 'KÖYLÜLER (TOWNSFOLK)', class: 'team-townsfolk' },
        { id: 'outsider', title: 'YABANCILAR (OUTSIDERS)', class: 'team-outsider' },
        { id: 'minion', title: 'PİYONLAR (MINIONS)', class: 'team-minion' },
        { id: 'demon', title: 'İBLİSLER (DEMONS)', class: 'team-demon' },
        { id: 'traveller', title: 'GEZGİNLER (TRAVELLERS)', class: 'team-traveller' },
        { id: 'fabled', title: 'EFSANEVİLER (FABLED)', class: 'team-fabled' }
      ];

      teamsOrder.forEach(team => {
        const teamRoles = roles.filter(r => r.team === team.id);
        if (teamRoles.length > 0) {
          const titleEl = document.createElement('h3');
          titleEl.className = `team-title ${team.class}`;
          titleEl.innerText = team.title;
          container.appendChild(titleEl);

          teamRoles.forEach(role => {
            const card = document.createElement('div');
            card.className = 'role-card';
            card.innerHTML = `
              <div class="role-header">
                <span class="role-name">${role.name}</span>
              </div>
              <div class="role-ability">${role.ability}</div>
            `;
            container.appendChild(card);
          });
        }
      });
    }

    function filterRoles() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = currentScriptRoles.filter(r => 
        r.name.toLowerCase().includes(query) || r.ability.toLowerCase().includes(query)
      );
      renderRoleList(filtered);
    }

    function showHomeView() {
      document.getElementById('role-list-view').style.display = 'none';
      document.getElementById('home-view').style.display = 'block';
      document.getElementById('search-input').value = '';
    }
  </script>
</body>
</html>
