<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Grimoire | Tavern Games</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="grim.css?v=20261023-0019">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="tokArc" d="M 11,52 A 39,39 0 0 0 89,52"/></defs></svg>
<div id="boot" class="center-msg">Yükleniyor…</div>

<section id="login" class="screen" hidden>
  <form class="card narrow" id="loginForm">
    <img src="/assets/logo_beyaz_kenar_yazisiz.webp" alt="" class="logo">
    <h1>Grimoire</h1>
    <input id="lEmail" type="email" placeholder="E-posta" autocomplete="username" required>
    <input id="lPass" type="password" placeholder="Şifre" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Giriş yap</button>
    <p id="lErr" class="err" hidden>Giriş başarısız.</p>
  </form>
</section>

<section id="setup" class="screen" hidden></section>

<section id="game" class="screen" hidden>
  <header class="bar">
    <button class="ib" data-act="menu" aria-label="Menü">☰</button>
    <button class="phase-btn" data-act="steps"><span id="phaseTxt"></span><small id="phaseSub"></small></button>
    <button class="btn primary small" id="editDoneBtn" data-act="editDone" hidden>✓ Yerleşim bitti</button>
    <div class="seg" id="seg"><button data-pg="0" class="on">Masa</button><button data-pg="1">Panel</button></div>
    <button class="ib" data-act="undo" aria-label="Geri al" id="undoBtn">↶</button>
  </header>
  <div id="pager" class="pager">
    <section class="pane" id="pane1"><div id="board" class="board"></div></section>
    <section class="pane" id="pane2"><div id="panel" class="panel"></div></section>
  </div>
</section>

<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast" class="toast" hidden></div>
<div id="show" class="show" hidden></div>
<div id="update" class="update" hidden></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyDtHAhzYNDf7PHrj-48EelC6OQtp3pkv4E",authDomain:"tavern-quiz.firebaseapp.com",databaseURL:"https://tavern-quiz-default-rtdb.europe-west1.firebasedatabase.app",projectId:"tavern-quiz",appId:"1:280835700622:web:043d61c02d689de87056df"});
</script>
<script type="module" src="js/app.js?v=20261023-0019"></script>
</body>
</html>
